# Builds the CallPilot iPhone app on a GitHub Mac and sends it to TestFlight.
# Same shape as the Squiggle and Sparkle House workflows, so the same three repository secrets make it go:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the full text of the App Store Connect .p8 key)
# Until those exist, every run only checks that the app compiles for the simulator.
# Signing is automatic (cloud-managed): Xcode creates the certificates and the app's profile in your Apple
# account, so no certificate files live in GitHub. The Team ID isn't secret; it's set below.
# TestFlight also needs the app to exist in App Store Connect (bundle ID com.jarredsmith.callpilot).
name: iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - manifest.webmanifest
      - icon-*.png
      - ios-app/**
      - .github/workflows/ios.yml

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIGNING: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
      PROJECT: ios-app/ios/App/App.xcodeproj
      TEAM: ${{ vars.APPLE_TEAM_ID || 'SVYYTM3LTN' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Bundle the web app into the iPhone project
        working-directory: ios-app
        run: |
          npm ci
          node scripts/copy-web.mjs
          npx cap sync ios
          echo "Native plugins registered:"; grep -A8 packageClassList ios/App/App/capacitor.config.json

      - name: Check that it compiles (no signing key yet)
        if: env.SIGNING != 'true'
        run: |
          echo "::notice::App Store Connect key not set up yet, so this run only checks the build. See the comments at the top of ios.yml."
          set +e
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1
          STATUS=$?
          grep -E "error:|warning: .*/native/|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" | tail -n 80
          [ $STATUS -eq 0 ] || tail -n 40 "$RUNNER_TEMP/build.log"
          # compile errors also become annotations, so they show on the run's summary page
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -n 20 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $STATUS

      - name: Save the App Store Connect key for Xcode
        if: env.SIGNING == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build for the App Store
        if: env.SIGNING == 'true'
        run: |
          set +e
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/build.log" 2>&1
          STATUS=$?
          grep -E "error:|warning: .*/native/|ARCHIVE (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" | tail -n 80
          [ $STATUS -eq 0 ] || tail -n 40 "$RUNNER_TEMP/build.log"
          # compile errors also become annotations, so they show on the run's summary page
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -n 20 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $STATUS

      - name: Stamp the entitlements onto the archive
        if: env.SIGNING == 'true'
        run: |
          # The archive is built unsigned (no development certificate on the runner), which also leaves
          # out App/App.entitlements (time-sensitive notifications). Export reads an app's entitlements from
          # its signature, so give the archived app an ad-hoc signature that carries them; export then
          # re-signs everything with the distribution certificate and a profile with the matching capability.
          set -e
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          ENT="ios-app/ios/App/App/App.entitlements"
          find "$APP/Frameworks" -name '*.framework' -maxdepth 1 -print0 2>/dev/null | xargs -0 -n1 codesign --force --sign - || true
          codesign --force --sign - --entitlements "$ENT" "$APP"
          echo "Entitlements now in the archive:"
          codesign -d --entitlements :- "$APP" 2>/dev/null | head -n 30

      - name: Sign and upload to TestFlight
        if: env.SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -n 60
          echo "::notice::Build ${{ github.run_number }} uploaded. It shows up in TestFlight after Apple finishes processing (usually 5 to 15 minutes)."

      - name: Remove the key
        if: always() && env.SIGNING == 'true'
        run: rm -rf "$RUNNER_TEMP/keys"
